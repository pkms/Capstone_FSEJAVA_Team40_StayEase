<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Default hotel image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B6D61"/>
      <stop offset="1" stop-color="#054F46"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Stylized hotel building -->
  <g transform="translate(140,80)">
    <rect x="0" y="0" width="520" height="320" rx="18" fill="#F7F2E7" opacity="0.10" />

    <!-- windows grid -->
    <g fill="#F0DBA8" opacity="0.92">
      <g>
        <rect x="48" y="48" width="64" height="48" rx="6" />
        <rect x="48" y="112" width="64" height="48" rx="6" />
        <rect x="48" y="176" width="64" height="48" rx="6" />
      </g>
      <g transform="translate(120,0)">
        <rect x="0" y="48" width="64" height="48" rx="6" />
        <rect x="0" y="112" width="64" height="48" rx="6" />
        <rect x="0" y="176" width="64" height="48" rx="6" />
      </g>
      <g transform="translate(240,0)">
        <rect x="0" y="48" width="64" height="48" rx="6" />
        <rect x="0" y="112" width="64" height="48" rx="6" />
        <rect x="0" y="176" width="64" height="48" rx="6" />
      </g>
      <g transform="translate(360,0)">
        <rect x="0" y="48" width="64" height="48" rx="6" />
        <rect x="0" y="112" width="64" height="48" rx="6" />
        <rect x="0" y="176" width="64" height="48" rx="6" />
      </g>
    </g>

    <!-- entrance / awning -->
    <rect x="200" y="232" width="120" height="72" rx="10" fill="#C0913A" opacity="0.35" />
  </g>

  <!-- perforation strip, ties to the ticket motif used across cards -->
  <g stroke="#F7F2E7" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8">
    <line x1="0" y1="430" x2="800" y2="430" />
  </g>

  <!-- subtle label -->
  <text x="50%" y="92%" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F7F2E7" fill-opacity="0.92">Beautiful stay awaits</text>
</svg>
