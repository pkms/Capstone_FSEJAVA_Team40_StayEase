<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Default hotel image">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#5EE7DF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Stylized hotel building -->
  <g transform="translate(140,80)">
    <rect x="0" y="0" width="520" height="320" rx="18" fill="#ffffff" opacity="0.12" />

    <!-- windows grid -->
    <g fill="#ffffff" opacity="0.9">
      <!-- columns -->
      <g>
        <rect x="48" y="48" width="64" height="48" rx="6" />
        <rect x="48" y="112" width="64" height="48" rx="6" />
        <rect x="48" y="176" width="64" height="48" rx="6" />
      </g>
      <g transform="translate(120,0)">
        <rect x="0" y="48" width="64" height="48" rx="6" />
        <rect x="0" y="112" width="64" height="48" rx="6" />
        <rect x="0" y="176" width="64" height="48" rx="6" />
      </g>
      <g transform="translate(240,0)">
        <rect x="0" y="48" width="64" height="48" rx="6" />
        <rect x="0" y="112" width="64" height="48" rx="6" />
        <rect x="0" y="176" width="64" height="48" rx="6" />
      </g>
      <g transform="translate(360,0)">
        <rect x="0" y="48" width="64" height="48" rx="6" />
        <rect x="0" y="112" width="64" height="48" rx="6" />
        <rect x="0" y="176" width="64" height="48" rx="6" />
      </g>
    </g>

    <!-- entrance / awning -->
    <rect x="200" y="232" width="120" height="72" rx="10" fill="#ffffff" opacity="0.14" />
  </g>

  <!-- subtle label -->
  <text x="50%" y="92%" text-anchor="middle" font-family="Segoe UI, Roboto, Arial" font-size="20" fill="rgba(255,255,255,0.9)">Beautiful stay awaits</text>
</svg>
