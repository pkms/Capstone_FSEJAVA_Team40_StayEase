<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Admin dashboard preview">
  <rect width="100%" height="100%" fill="#0f172a" />
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="320" height="620" rx="12" fill="#0b1220" />
